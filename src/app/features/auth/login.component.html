<div class="login-page">
  <div class="theme-toggle-wrap">
    <app-theme-button />
  </div>

  <div class="login-card">
    <h2>Trainee Management</h2>
    <p class="subtitle">Log in to continue</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label>Email</label>
        <input placeholder="you@example.com" formControlName="email" autocomplete="email">
      </div>

      <div class="field">
        <label>Password</label>
        <input placeholder="password" formControlName="password" type="password" autocomplete="current-password">
      </div>

      <div class="form-actions">
        <app-button
          [type]="ButtonType.SUBMIT"
          [isDisable]="loginForm.invalid"
          (clicked)="onSubmit()">
          Login
        </app-button>
      </div>
    </form>
  </div>
</div>
