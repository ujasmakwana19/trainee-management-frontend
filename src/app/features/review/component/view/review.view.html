<div class="page-container">
    <div class="header-actions">
        <app-button 
            [type]="ButtonType.BUTTON" 
            (clicked)="router.navigate([RoutePath.REVIEW_BASE, RoutePath.ADD])"
            [permission]="PermissionKey.REVIEW_ADD">
            {{TextValue.CREATE_REVIEW}}
        </app-button>
    </div>

    <app-data-table 
        [data]="reviewService.reviews()" 
        [columns]="columns" trackByProperty="id"/>
</div>
